name: Generate GitHub Metrics

on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check token (should show your login)
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.METRICS_TOKEN }}" https://api.github.com/user | jq -r '.login,.type'
        shell: bash

      - name: Full metrics
        uses: lowlighter/metrics@latest
        with:
          user: iMookatayou
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Bangkok
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output: action

      - name: Isometric contributions (3D)
        uses: lowlighter/metrics@latest
        with:
          user: iMookatayou
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics-isometric.svg
          base: ""
          plugin_isometric: yes
          plugin_isometric_duration: full-year
          output: action

      - name: Animate Joined GitHub & 1 Year text (Emerald RGB Flow)
        run: |
          python3 << 'EOF'
          from pathlib import Path
          import re
          import os

          if not os.path.exists("github-metrics.svg"):
              print("❌ Error: github-metrics.svg not found in workspace!")
              exit(1)

          path = Path("github-metrics.svg")
          svg = path.read_text()

          gradient = '''
          <defs>
            <linearGradient id="emeraldRgbGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#065F46" />
              <stop offset="50%" stop-color="#34D399" />
              <stop offset="100%" stop-color="#065F46" />
              <animateTransform 
                attributeName="gradientTransform" 
                type="translate" 
                from="-1 0" to="1 0" 
                dur="3s" 
                repeatCount="indefinite" />
            </linearGradient>
          </defs>
          '''

          if "emeraldRgbGradient" not in svg:
              svg = re.sub(
                  r'(<svg[^>]*>)',
                  r'\1\n' + gradient,
                  svg,
                  count=1
              )

          svg = svg.replace(
              'fill="currentColor">Joined GitHub',
              'fill="url(#emeraldRgbGradient)" font-weight="800">Joined GitHub'
          )

          svg = re.sub(
              r'fill="currentColor">([^<]*1\s*years?[^<]*)<',
              r'fill="url(#emeraldRgbGradient)" font-weight="800">\1<',
              svg
          )

          path.write_text(svg)
          print("✅ Successfully added Emerald RGB effect to text!")
          EOF

      - name: Commit & Push updated SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: update metrics with emerald RGB effect"
          file_pattern: "*.svg"
