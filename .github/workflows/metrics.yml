name: Generate GitHub Metrics

on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: |
          curl -s -H "Authorization: Bearer ${{ secrets.METRICS_TOKEN }}" https://api.github.com/user | jq -r '.login,.type'
        shell: bash

      - uses: lowlighter/metrics@latest
        with:
          user: iMookatayou
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Bangkok
          plugin_languages: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Emerald RGB Injection
        run: |
          python3 << 'EOF'
          from pathlib import Path
          import re
          import os

          file_path = "github-metrics.svg"
          if os.path.exists(file_path):
              svg = Path(file_path).read_text()
              
              gradient = '''
              <defs>
                <linearGradient id="emeraldRgbGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#065F46" />
                  <stop offset="50%" stop-color="#34D399" />
                  <stop offset="100%" stop-color="#065F46" />
                  <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3s" repeatCount="indefinite" />
                </linearGradient>
              </defs>
              '''
              
              if "emeraldRgbGradient" not in svg:
                  svg = re.sub(r'(<svg[^>]*>)', r'\1\n' + gradient, svg, count=1)

              # เจาะจงหา text element ที่มีคำว่า Joined GitHub และ 1 year
              svg = re.sub(r'(Joined\s+GitHub)', r'<tspan fill="url(#emeraldRgbGradient)" font-weight="800">\1</tspan>', svg)
              svg = re.sub(r'([^<]*1\s*years?(\s+ago)?)', r'<tspan fill="url(#emeraldRgbGradient)" font-weight="800">\1</tspan>', svg)
              
              Path(file_path).write_text(svg)
          EOF

      - name: Final Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          git commit -m "feat: emerald rgb flow" || exit 0
          git push origin HEAD --force
