name: Generate GitHub Metrics

on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Full metrics
        uses: lowlighter/metrics@latest
        with:
          user: iMookatayou
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Bangkok
          plugin_languages: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Emerald RGB Injection
        run: |
          python3 << 'EOF'
          from pathlib import Path
          import re
          import os

          file_path = "github-metrics.svg"
          if os.path.exists(file_path):
              path = Path(file_path)
              svg = path.read_text()
              
              # 1. แทรก Gradient เฉพาะถ้ายังไม่มี
              if "emeraldRgbGradient" not in svg:
                  gradient = '''<defs><linearGradient id="emeraldRgbGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#065F46" /><stop offset="50%" stop-color="#34D399" /><stop offset="100%" stop-color="#065F46" /><animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3s" repeatCount="indefinite" /></linearGradient></defs>'''
                  svg = svg.replace("</svg>", f"{gradient}</svg>")

              # 2. ค้นหาบรรทัดที่มี Joined GitHub แล้วเปลี่ยน fill ที่ tag <text> นั้นเลย
              # ใช้ regex ดึงกลุ่มของ <text ...>Joined GitHub</text>
              svg = re.sub(
                  r'(<text[^>]*fill=")[^"]*("[^>]*>\s*Joined\s+GitHub)',
                  r'\1url(#emeraldRgbGradient)\2',
                  svg
              )

              # 3. ค้นหาบรรทัดที่มี 1 year / 1 years
              svg = re.sub(
                  r'(<text[^>]*fill=")[^"]*("[^>]*>\s*[^<]*1\s*years?(\s+ago)?\s*)',
                  r'\1url(#emeraldRgbGradient)\2',
                  svg
              )

              path.write_text(svg)
          EOF

      - name: Final Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          git commit -m "feat: fix emerald rgb rendering" || exit 0
          git push origin HEAD --force
