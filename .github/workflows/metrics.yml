name: Generate GitHub Metrics

on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate full metrics
        uses: lowlighter/metrics@latest
        with:
          user: iMookatayou
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata

          config_timezone: Asia/Bangkok

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Animate Joined GitHub text
        run: |
          python3 << 'EOF'
          from pathlib import Path
          import re

          path = Path("github-metrics.svg")
          svg = path.read_text()

          gradient = """
          <defs>
            <linearGradient id="joinedGradient" x1="0%" y1="0%" x2="200%" y2="0%">

              <stop offset="0%" stop-color="#10B981">
                <animate attributeName="stop-color"
                  values="#10B981;#34D399;#6EE7B7;#059669;#10B981"
                  dur="8s"
                  repeatCount="indefinite"/>
              </stop>

              <stop offset="50%" stop-color="#34D399">
                <animate attributeName="stop-color"
                  values="#34D399;#6EE7B7;#059669;#10B981;#34D399"
                  dur="8s"
                  repeatCount="indefinite"/>
              </stop>

              <stop offset="100%" stop-color="#6EE7B7">
                <animate attributeName="stop-color"
                  values="#6EE7B7;#059669;#10B981;#34D399;#6EE7B7"
                  dur="8s"
                  repeatCount="indefinite"/>
              </stop>

              <animateTransform
                attributeName="gradientTransform"
                type="translate"
                from="-1 0"
                to="1 0"
                dur="6s"
                repeatCount="indefinite"/>
            </linearGradient>
          </defs>
          """

          if "joinedGradient" not in svg:
              svg = svg.replace("<svg", gradient + "\n<svg", 1)

          svg = re.sub(
              r'fill="currentColor">Joined GitHub',
              'fill="url(#joinedGradient)" font-weight="700">Joined GitHub',
              svg
          )

          path.write_text(svg)
          EOF

      - name: Generate isometric metrics
        uses: lowlighter/metrics@latest
        with:
          user: iMookatayou
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          filename: metrics-isometric.svg
          base: ""

          plugin_isometric: yes
          plugin_isometric_duration: full-year

      - name: Commit generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-metrics.svg metrics-isometric.svg

          git commit -m "chore: update github metrics [skip ci]" || echo "No changes"

          git push
