- name: Animate Joined GitHub text
  run: |
    python3 << 'EOF'
    from pathlib import Path
    import re

    path = Path("github-metrics.svg")
    svg = path.read_text()

    gradient = '''
    <defs>
      <linearGradient id="joinedGradient" x1="0%" y1="0%" x2="200%" y2="0%">

        <stop offset="0%" stop-color="#10B981">
          <animate attributeName="stop-color"
            values="#10B981;#34D399;#06B6D4;#A7F3D0;#10B981"
            dur="10s"
            repeatCount="indefinite"/>
        </stop>

        <stop offset="50%" stop-color="#34D399">
          <animate attributeName="stop-color"
            values="#34D399;#06B6D4;#A7F3D0;#10B981;#34D399"
            dur="10s"
            repeatCount="indefinite"/>
        </stop>

        <stop offset="100%" stop-color="#A7F3D0">
          <animate attributeName="stop-color"
            values="#A7F3D0;#10B981;#34D399;#06B6D4;#A7F3D0"
            dur="10s"
            repeatCount="indefinite"/>
        </stop>

        <animateTransform
          attributeName="gradientTransform"
          type="translate"
          from="-1 0"
          to="1 0"
          dur="8s"
          repeatCount="indefinite"/>
      </linearGradient>
    </defs>
    '''

    svg = svg.replace("<svg", gradient + "\n<svg", 1)

    svg = re.sub(
        r'fill="currentColor">Joined GitHub .*?</text>',
        lambda m: m.group(0).replace(
            'fill="currentColor"',
            'fill="url(#joinedGradient)" font-weight="600"'
        ),
        svg
    )

    path.write_text(svg)
    EOF
