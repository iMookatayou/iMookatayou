- name: Animate Joined GitHub text
  run: |
    python3 << 'EOF'
    from pathlib import Path
    import re

    path = Path("github-metrics.svg")
    svg = path.read_text()

    gradient = """
    <defs>
      <linearGradient id="joinedGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#10B981">
          <animate attributeName="stop-color"
            values="#10B981;#34D399;#6EE7B7;#059669;#10B981"
            dur="8s"
            repeatCount="indefinite"/>
        </stop>

        <stop offset="50%" stop-color="#34D399">
          <animate attributeName="stop-color"
            values="#34D399;#6EE7B7;#059669;#10B981;#34D399"
            dur="8s"
            repeatCount="indefinite"/>
        </stop>

        <stop offset="100%" stop-color="#6EE7B7">
          <animate attributeName="stop-color"
            values="#6EE7B7;#059669;#10B981;#34D399;#6EE7B7"
            dur="8s"
            repeatCount="indefinite"/>
        </stop>
      </linearGradient>
    </defs>
    """

    # inject defs safely after <svg ...>
    svg = re.sub(
        r'(<svg[^>]*>)',
        r'\\1\n' + gradient,
        svg,
        count=1
    )

    # replace Joined GitHub text color
    svg = svg.replace(
        'fill="currentColor">Joined GitHub',
        'fill="url(#joinedGradient)" font-weight="700">Joined GitHub'
    )

    path.write_text(svg)
    EOF
