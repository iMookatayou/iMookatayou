      - name: Animate Joined GitHub text
        run: |
          python3 << 'EOF'
          from pathlib import Path
          import re

          path = Path("github-metrics.svg")
          svg = path.read_text()

          gradient = '''
          <defs>
            <linearGradient id="joinedGradient" x1="0%" y1="0%" x2="200%" y2="0%">
              <stop offset="0%" stop-color="#7dd3fc">
                <animate attributeName="stop-color"
                  values="#7dd3fc;#c4b5fd;#86efac;#7dd3fc"
                  dur="6s"
                  repeatCount="indefinite"/>
              </stop>
              <stop offset="50%" stop-color="#c4b5fd">
                <animate attributeName="stop-color"
                  values="#c4b5fd;#86efac;#7dd3fc;#c4b5fd"
                  dur="6s"
                  repeatCount="indefinite"/>
              </stop>
              <stop offset="100%" stop-color="#86efac">
                <animate attributeName="stop-color"
                  values="#86efac;#7dd3fc;#c4b5fd;#86efac"
                  dur="6s"
                  repeatCount="indefinite"/>
              </stop>

              <animateTransform
                attributeName="gradientTransform"
                type="translate"
                from="-1 0"
                to="1 0"
                dur="5s"
                repeatCount="indefinite"/>
            </linearGradient>
          </defs>
          '''

          svg = svg.replace("<svg", gradient + "\n<svg", 1)

          svg = re.sub(
              r'fill="currentColor">Joined GitHub .*?</text>',
              lambda m: m.group(0).replace(
                  'fill="currentColor"',
                  'fill="url(#joinedGradient)" font-weight="600"'
              ),
              svg
          )

          path.write_text(svg)
          EOF
